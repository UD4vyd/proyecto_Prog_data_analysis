[project]
name = "extreme-weather-monitoring"
version = "0.1.0"
description = ""
authors = [
    {name = "David Martinez",email = "davidmartinezrincon9@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyspark (>=4.1.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "fpdf2 (>=2.9.0,<3.0.0)",
    "markdown (>=3.11.3,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "nbconvert (>=7.17.2,<8.0.0)",
    "pytest (>=9,<10)"
]
# Workshop 4: the two Plotly Dash dashboards (not installed in the Airflow image, see dashboard/Dockerfile)
dashboard = [
    "dash (>=3.0,<4.0)",
    "plotly (>=6.0,<7.0)",
    "dash-bootstrap-components (>=2.0,<3.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
