[project]
name = "extreme-weather-monitoring"
version = "0.1.0"
description = ""
authors = [
    {name = "David Martinez",email = "davidmartinezrincon9@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "fpdf2 (>=2.9.0,<3.0.0)",
    "markdown (>=3.11.3,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "nbconvert (>=7.17.2,<8.0.0)",
    "pytest (>=9,<10)",
    "pypdf (>=7.1.0,<8.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
